name: Build SAYYAR APK

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Fix file layout (move flat files into place)
        shell: bash
        run: |
          mkdir -p lib assets/icon
          if [ ! -f lib/main.dart ] && [ -f main.dart ]; then mv main.dart lib/main.dart; fi
          for f in icon.png icon_foreground.png avatar.png; do
            if [ ! -f assets/icon/$f ] && [ -f $f ]; then cp $f assets/icon/$f; fi
          done
          ls -la . lib assets/icon

      - name: Ensure icon files exist (placeholder if missing)
        shell: bash
        run: |
          if [ ! -f assets/icon/icon.png ] || [ ! -f assets/icon/icon_foreground.png ]; then
            echo "Icons missing from repo - generating placeholders"
            mkdir -p assets/icon
            pip install pillow
            python3 - <<'PY'
          from PIL import Image, ImageDraw
          def make(path, bg):
              im = Image.new("RGBA", (1024, 1024), bg)
              d = ImageDraw.Draw(im)
              d.ellipse((312, 312, 712, 712), fill=(34, 230, 160, 255))
              d.polygon([(512, 360), (610, 640), (512, 590), (414, 640)], fill=(4, 32, 28, 255))
              im.save(path)
          make("assets/icon/icon.png", (4, 32, 28, 255))
          make("assets/icon/icon_foreground.png", (0, 0, 0, 0))
          make("assets/icon/avatar.png", (4, 32, 28, 255))
          PY
          fi
          ls -la assets/icon

      - name: Generate Android platform files
        run: |
          flutter create --platforms=android --org com.sayyar --project-name sayyar /tmp/sayyar_android
          rm -rf android
          cp -R /tmp/sayyar_android/android ./android

      - name: Configure AndroidManifest
        shell: bash
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text(encoding="utf-8")
          m = re.search(r"<manifest[^>]*>", s)
          extra = """
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>
              <uses-permission android:name="android.permission.WAKE_LOCK"/>
              <queries>
                  <intent>
                      <action android:name="android.intent.action.TTS_SERVICE"/>
                  </intent>
              </queries>
          """
          if "ACCESS_FINE_LOCATION" not in s:
              s = s[:m.end()] + extra + s[m.end():]
          s = re.sub(r'android:label="[^"]*"', 'android:label="سيّار"', s, count=1)
          p.write_text(s, encoding="utf-8")
          PY

      - run: flutter pub get
      - run: dart run flutter_launcher_icons
      - run: flutter analyze --no-pub --no-fatal-infos --no-fatal-warnings || true
      - run: flutter build apk --release
      - run: cp build/app/outputs/flutter-apk/app-release.apk Sayyar.apk

      - uses: actions/upload-artifact@v4
        with:
          name: SAYYAR-APK
          path: Sayyar.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: SAYYAR build ${{ github.run_number }}
          files: Sayyar.apk
          make_latest: true
